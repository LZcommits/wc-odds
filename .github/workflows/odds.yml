name: WC Odds Tracker
on:
  schedule:
    - cron: '0 * * * *'          # 每 1 小时(UTC)· 数据源已迁移 API-Football Pro
  workflow_dispatch: {}           # 仓库页可手动点击运行
permissions:
  contents: write                 # 允许把数据/页面提交回仓库
concurrency:
  group: odds
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 采样 + 生成 H5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python wc_odds.py
      - name: 提交数据与页面
        run: |
          git config user.name "odds-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          git commit -m "snapshot $(date -u +%FT%TZ)" || echo "无变化"
          git push
